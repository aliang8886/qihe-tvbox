<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>启禾影视 · 设备后台</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1410;color:#eef8f0;font-family:Inter,"Microsoft YaHei",sans-serif}.wrap{max-width:1080px;margin:auto;padding:44px 20px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}.eyebrow{color:#77dda1;font-size:12px;letter-spacing:.2em}.top h1{font-size:clamp(34px,6vw,62px);margin:8px 0;letter-spacing:-.05em}.muted{color:#8da498}.manage{color:white;background:#258c51;text-decoration:none;padding:12px 18px;border-radius:12px;font-weight:700;white-space:nowrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:32px 0}.stat{background:#14241c;border:1px solid #2b4437;border-radius:17px;padding:20px}.stat span{color:#789083;font-size:13px}.stat b{display:block;font-size:34px;margin-top:9px}.tools{display:flex;gap:10px;margin:22px 0}.tools input{flex:1;background:#13231b;color:white;border:1px solid #304b3d;border-radius:12px;padding:13px}.tools button,.copy{border:0;border-radius:10px;background:#e8f1e9;color:#18301f;padding:10px 13px;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.card{background:#edf4eb;color:#15241a;border-radius:20px;padding:20px}.cardhead{display:flex;justify-content:space-between;align-items:center}.card h2{margin:0;font-size:22px}.pill{font-size:12px;padding:6px 10px;border-radius:99px;background:#d2e8d8;color:#1f7040}.pill.off{background:#f0d3d3;color:#943b3b}.meta{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:20px 0}.meta span{display:block;color:#708275;font-size:12px;margin-bottom:5px}.meta b{font-size:14px}.url{background:#dbe8dc;border-radius:10px;padding:11px;font:11px monospace;word-break:break-all}.actions{display:flex;gap:8px;margin-top:14px}.actions a{color:#476251;text-decoration:none;padding:9px}.empty{grid-column:1/-1;padding:50px;text-align:center;color:#789083;border:1px dashed #365243;border-radius:18px}footer{text-align:center;color:#657a6e;margin-top:34px;font-size:12px}@media(max-width:700px){.top{flex-direction:column}.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.wrap{padding:28px 14px}}
</style></head><body><main class="wrap"><header class="top"><div><div class="eyebrow">QI HE DEVICE CONSOLE</div><h1>启禾影视<br>设备后台</h1><p class="muted">查看所有分发设备、到期时间与接口状态。</p></div><a class="manage" href="https://github.com/aliang8886/qihe-tvbox/actions/workflows/device-manager.yml" target="_blank">＋ 管理设备</a></header><section class="stats"><div class="stat"><span>设备总数</span><b id="total">—</b></div><div class="stat"><span>正常使用</span><b id="active">—</b></div><div class="stat"><span>已停用</span><b id="disabled">—</b></div><div class="stat"><span>已过期</span><b id="expired">—</b></div></section><div class="tools"><input id="search" placeholder="搜索设备名称或编号"><button onclick="load()">刷新</button></div><section class="grid" id="grid"><div class="empty">正在读取设备资料…</div></section><footer>数据来自 GitHub · 每天北京时间约 03:17 自动检查到期状态</footer></main><script>
const DATA='./devices.json',ACTIONS='https://github.com/aliang8886/qihe-tvbox/actions/workflows/device-manager.yml';let all=[];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function state(d){if(!d.enabled)return['已停用','off'];if(Date.parse(d.expiresAt)<=Date.now())return['已过期','off'];return['正常','']}function render(){const q=document.querySelector('#search').value.toLowerCase(),list=all.filter(d=>(d.name+d.id).toLowerCase().includes(q));document.querySelector('#total').textContent=all.length;document.querySelector('#active').textContent=all.filter(d=>d.enabled&&Date.parse(d.expiresAt)>Date.now()).length;document.querySelector('#disabled').textContent=all.filter(d=>!d.enabled).length;document.querySelector('#expired').textContent=all.filter(d=>d.enabled&&Date.parse(d.expiresAt)<=Date.now()).length;document.querySelector('#grid').innerHTML=list.length?list.map(d=>{const [label,cl]=state(d),days=Math.max(0,Math.ceil((Date.parse(d.expiresAt)-Date.now())/86400000)),url=`https://raw.githubusercontent.com/aliang8886/qihe-tvbox/main/devices/${d.id}.json`;return `<article class="card"><div class="cardhead"><h2>${esc(d.name)}</h2><span class="pill ${cl}">${label}</span></div><div class="meta"><div><span>设备编号</span><b>${esc(d.id)}</b></div><div><span>剩余时间</span><b>${days} 天</b></div><div><span>到期日期</span><b>${new Date(d.expiresAt).toLocaleDateString('zh-CN')}</b></div><div><span>当前权限</span><b>${d.enabled?'允许':'禁止'}</b></div></div><div class="url">${url}</div><div class="actions"><button class="copy" onclick="navigator.clipboard.writeText('${url}')">复制接口</button><a href="${ACTIONS}" target="_blank">续期 / 停用</a></div></article>`}).join(''):'<div class="empty">暂无匹配设备</div>'}async function load(){try{const r=await fetch(DATA+'?t='+Date.now());all=(await r.json()).devices||[];render()}catch(e){document.querySelector('#grid').innerHTML='<div class="empty">读取失败，请稍后刷新</div>'}}document.querySelector('#search').addEventListener('input',render);load();
</script></body></html>
