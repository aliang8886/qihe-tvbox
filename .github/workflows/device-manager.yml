name: 启禾影视设备管理

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 操作
        required: true
        type: choice
        options: [新增或续期, 停用, 启用]
      device_id:
        description: 设备编号（新增可自定，如 child-tv；留空则随机生成）
        required: false
      device_name:
        description: 显示名称
        required: false
        default: 儿童电视
      valid_days:
        description: 从现在起有效天数
        required: false
        default: "30"
  schedule:
    # 每天北京时间约 03:17（UTC 19:17）检查一次
    - cron: "17 19 * * *"

permissions:
  contents: write

jobs:
  manage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 更新设备资料
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          case "${{ inputs.operation }}" in
            "新增或续期") node scripts/manage-device.mjs upsert "${{ inputs.device_id }}" "${{ inputs.device_name }}" "${{ inputs.valid_days }}" true ;;
            "停用") node scripts/manage-device.mjs disable "${{ inputs.device_id }}" ;;
            "启用") node scripts/manage-device.mjs enable "${{ inputs.device_id }}" ;;
          esac
      - name: 生成所有设备接口
        run: node scripts/render-devices.mjs
      - name: 保存变更
        run: |
          git config user.name "qihe-device-bot"
          git config user.email "actions@users.noreply.github.com"
          git add devices.json devices
          git diff --cached --quiet || git commit -m "更新设备接口"
          git push
